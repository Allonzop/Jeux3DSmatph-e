# Fusionne dans `main` toute branche `claude/*` poussée par la routine, une
# fois le typecheck et le build passés — puis supprime la branche.
#
# Déclenché sur le PUSH de la branche, pas sur l'ouverture d'une PR : l'agent
# de routine pousse toujours sa branche, mais n'ouvre pas toujours de PR (c'est
# ce qui, avec l'ancienne consigne, laissait le travail bloqué). Se déclencher
# sur le push retire cette dépendance — l'agent n'a qu'à pousser, la fusion est
# garantie.
#
# La vérification porte sur le RÉSULTAT de la fusion (main + branche), pas sur
# la branche seule : c'est ce qui attrape une régression d'intégration.
name: Fusion auto des branches de routine

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  # Une fusion à la fois : deux branches fusionnées en parallèle se
  # marcheraient dessus sur `main`.
  group: auto-merge
  cancel-in-progress: false

jobs:
  verify-and-merge:
    # Ignorer l'événement de suppression de branche (le workflow supprime la
    # branche à la fin, ce qui est aussi un push).
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fusionner la branche dans main (local, pour vérifier le résultat)
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # Un conflit fait échouer l'étape : la branche reste, rien n'est
          # poussé, et on peut aller voir. Avec une séance par jour et des
          # tâches distinctes, c'est rare.
          git merge --no-edit "origin/$BRANCH"

      - name: Installer
        run: pnpm install --frozen-lockfile --filter "@workspace/3d-game..." --filter "@workspace/character-studio..."

      # Le filet : typecheck + build attrapent le code qui ne compile pas et ce
      # que seule la production casse. Le test de jouabilité (`wave.mjs`) exige
      # un navigateur, trop lourd ici — l'agent le lance pendant sa séance et le
      # consigne au journal.
      - name: Typecheck
        run: pnpm --filter @workspace/3d-game run typecheck

      - name: Build du jeu
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @workspace/3d-game run build

      - name: Pousser main et supprimer la branche
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push origin HEAD:main
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
            && echo "branche supprimée" || echo "branche déjà absente"
