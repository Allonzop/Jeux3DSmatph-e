# Publie le jeu sur GitHub Pages à chaque push sur main.
#
# Le jeu est une application entièrement statique : aucun serveur, aucun appel
# réseau, l'état tient dans le localStorage. Le build produit
# `artifacts/3d-game/dist/public/`, qui est exactement ce que Pages sert.
#
# BASE_PATH est indispensable : Pages sert le site sous
# `https://<compte>.github.io/<dépôt>/`, et sans ce préfixe le navigateur
# chercherait les assets à la racine du domaine et n'afficherait qu'une page
# noire. Il vaut « / » en local, d'où la variable.
name: Déployer le jeu sur GitHub Pages

on:
  push:
    branches: [main]
  # Après une fusion automatique, `main` est poussé par le jeton d'Actions.
  # GitHub bloque volontairement les workflows déclenchés en chaîne par ce
  # jeton (anti-récursion), donc le `push` ci-dessus ne suffit pas : sans ce
  # `workflow_run`, le jeu ne se redéploierait jamais après une fusion de
  # routine. `workflow_run`, lui, se déclenche à la fin d'un autre workflow,
  # quelle qu'en soit l'origine.
  workflow_run:
    workflows: ['Fusion auto des branches de routine']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois. On ne met pas `cancel-in-progress` : un
# déploiement interrompu peut laisser Pages dans un état incohérent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Ne pas déployer si la fusion auto a échoué (build cassé) : dans ce cas
    # `main` n'a pas bougé, rien à publier.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Déclenché par workflow_run, l'événement porte sur un autre workflow :
      # on force le checkout de la pointe de main, l'état à publier.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Seulement le jeu et ses dépendances d'espace de travail. Une install
      # complète tirerait Expo et React Native — près d'un gigaoctet dont le
      # jeu n'a aucun besoin.
      - name: Installer les dépendances du jeu et du studio
        run: pnpm install --frozen-lockfile --filter "@workspace/3d-game..." --filter "@workspace/character-studio..."

      - name: Construire le jeu
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @workspace/3d-game run build

      # Le studio est statique lui aussi : rien ne l'oblige à tourner en local.
      # Publié sous /studio/, il s'ouvre depuis n'importe quel navigateur, sans
      # clone ni installation. La bibliothèque de personnages vit dans le
      # localStorage du navigateur, donc chacun garde la sienne.
      #
      # La ligne de commande (`studio gen`, `audit`, `emit`), elle, reste locale
      # — c'est un outil d'agent, pas une page web.
      - name: Construire le studio de personnages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/studio/
        run: pnpm --filter @workspace/character-studio run build

      - name: Rassembler les deux sous un seul site
        run: |
          mkdir -p artifacts/3d-game/dist/public/studio
          cp -r artifacts/character-studio/dist/. artifacts/3d-game/dist/public/studio/

      - uses: actions/configure-pages@v5
        with:
          # Active Pages sur le dépôt au premier passage, pour n'avoir rien à
          # cliquer dans les réglages.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/3d-game/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
