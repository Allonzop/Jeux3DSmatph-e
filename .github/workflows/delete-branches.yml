# Supprime des branches nommées, à la demande. Utilitaire manuel : ne s'exécute
# jamais tout seul, et ne touche qu'aux branches qu'on lui donne explicitement.
#
# Sert à nettoyer les branches orphelines — par exemple une PR de routine dont
# le build a échoué et qui a été abandonnée. Les PR réussies, elles, sont déjà
# nettoyées par auto-merge.yml (--delete-branch).
name: Supprimer des branches (manuel)

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches à supprimer, séparées par des espaces'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer
        env:
          GH_TOKEN: ${{ github.token }}
          # Passé par variable, pas interpolé dans le script : pas d'injection.
          BRANCHES: ${{ github.event.inputs.branches }}
        run: |
          for b in $BRANCHES; do
            if [ "$b" = "main" ]; then
              echo "refus de supprimer main"
              continue
            fi
            echo "suppression $b"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" \
              && echo "  ok" || echo "  échec (déjà absente ?)"
          done
