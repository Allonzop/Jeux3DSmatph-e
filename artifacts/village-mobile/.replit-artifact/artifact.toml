kind = "mobile"
previewPath = "/village-mobile/"
title = "Village Spatial 3D Mobile"
version = "1.0.0"
id = "artifacts/village-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/village-mobile/" ]
localPort = 19830

[services.development]
run = "pnpm --filter @workspace/village-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/village-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/village-mobile", "run", "serve" ]

[services.env]
PORT = "19830"
BASE_PATH = "/village-mobile/"
